version: 2
updates:
  - package-ecosystem: "gomod" 
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Europe/Oslo"
    target-branch: "master"
    open-pull-requests-limit: 2
    # Group all minor- and patch-level updates in PR-s. Leave Major updates in individual PR-s
    groups:
      golang-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
