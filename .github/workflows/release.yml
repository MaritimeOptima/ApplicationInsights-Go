name: Release

# Manually triggered: Actions -> Release -> Run workflow, and enter the new version (e.g. 0.4.8).
# Sets Version in appinsights/package.go, commits, tags and creates a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without the v prefix (e.g. 0.4.8)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Set version, commit, tag and push
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          sed -i "s/Version = \".*\"/Version = \"$VERSION\"/" appinsights/package.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$VERSION"

      - name: Create GitHub release
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
